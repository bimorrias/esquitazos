name: Compilar APK Flutter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐦 Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x' # Puedes ajustarla a la versión con la que creaste tu app si es necesario
        channel: 'stable'
        cache: true

    - name: 📦 Obtener dependencias
      run: flutter pub get
      working-directory: esquitazos_app

    - name: 🔨 Compilar APK Release
      run: flutter build apk --release
      working-directory: esquitazos_app

    - name: 🚀 Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: esquitazos-release-apk
        path: esquitazos_app/build/app/outputs/flutter-apk/app-release.apk
